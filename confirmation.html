<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmation | Leaf &amp; Co2</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="confirmation">
  <header class="site-header">
    <nav class="container navigation" aria-label="Main navigation">
      <a class="brand" href="index.html">Leaf &amp; Co2</a>
      <div class="nav-links">
        <a id="shop-link" href="index.html">Shop</a>
        <a id="cart-link" href="cart.html">Cart <span id="cart-count" class="cart-count" aria-live="polite">(0)</span></a>
      </div>
    </nav>
  </header>
  <main class="container narrow">
    <h1>Thank you for your order</h1>
    <section class="panel" aria-label="Order details">
      <p id="order-number" class="order-number"></p>
      <ul id="order-items" class="item-list"></ul>
      <p id="order-total" class="total"></p>
    </section>
  </main>
</body>
</html>
